<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="100%" height="100%">
  <defs>
    <!-- Dégradé lumineux élégant (Bleu saphir / Lavande / Rose doux) -->
    <linearGradient id="infinityGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#f38ba8" />
    </linearGradient>

    <!-- Léger halo lumineux néon -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Fond sombre sobre */
    .bg { fill: #11111b; rx: 16px; }

    /* Typographie géométrique moderne, droite et uniforme */
    .letter {
      fill: #cdd6f4;
    }

    /* Rail discret de base pour l'infini */
    .inf-track {
      fill: none;
      stroke: #262738;
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Double pulsation fluide le long du lemniscate */
    .inf-beam-primary {
      fill: none;
      stroke: url(#infinityGlow);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 110 330;
      filter: url(#neonBlur);
      animation: loopOrbit 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .inf-beam-secondary {
      fill: none;
      stroke: url(#infinityGlow);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 55 385;
      stroke-dashoffset: -220;
      opacity: 0.85;
      filter: url(#neonBlur);
      animation: loopOrbit 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loopOrbit {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -440;
      }
    }
  </style>

  <!-- Arrière-plan sombre épuré (retirable si tu souhaites un fond transparent) -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Lettre N géométrique et droite -->
  <path class="letter" d="M 80,40 L 96,40 L 134,98 L 134,40 L 150,40 L 150,120 L 134,120 L 96,62 L 96,120 L 80,120 Z" />

  <!-- Symbole Infini remplaçant les "OO" -->
  <g transform="translate(140, 25)">
    <!-- Rail de guidage -->
    <path class="inf-track" d="M 105,55 C 135,15 180,15 180,55 C 180,95 135,95 105,55 C 75,15 30,15 30,55 C 30,95 75,95 105,55 Z" />

    <!-- Impulsions lumineuses synchronisées -->
    <path class="inf-beam-primary" d="M 105,55 C 135,15 180,15 180,55 C 180,95 135,95 105,55 C 75,15 30,15 30,55 C 30,95 75,95 105,55 Z" />

    <path class="inf-beam-secondary" d="M 105,55 C 135,15 180,15 180,55 C 180,95 135,95 105,55 C 75,15 30,15 30,55 C 30,95 75,95 105,55 Z" />
  </g>

  <!-- Lettre S géométrique, parfaitement droite et uniforme -->
  <path class="letter" d="M 403,58.5 L 386,58.5 C 386,52 380,48 373,48 C 363,48 357.5,53.5 357.5,59.5 C 357.5,66.5 363.5,70.5 376,74.5 L 381,76 C 397,81 405,87.5 405,99.5 C 405,113.5 393.5,122 373,122 C 354.5,122 341,114 340,99.5 L 357,99.5 C 358,107 364.5,111.5 373,111.5 C 383,111.5 388.5,106.5 388.5,99.5 C 388.5,92.5 382,88.5 369.5,84.5 L 364.5,83 C 348.5,78 341,71.5 341,59.5 C 341,46.5 353,38 373,38 C 390,38 402,46.5 403,58.5 Z" />
</svg>