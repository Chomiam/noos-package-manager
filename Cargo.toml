[package]
name = "noos-package-manager"
version = "0.1.5"
edition = "2021"
authors = ["Chomiam <axel.valens@ik.me>"]
description = "Gestionnaire de paquets graphique moderne en Rust (GTK4 / Libadwaita) et outil CLI (noos-up) pour Arch Linux supportant Pacman, l'AUR (RPC v5 + yay), Flatpak (Flathub) et les AppImages"
license = "GPL-3.0-or-later"
repository = "https://github.com/Chomiam/noos-package-manager"
homepage = "https://github.com/Chomiam/noos-package-manager"
readme = "README.md"
keywords = ["archlinux", "pacman", "aur", "flatpak", "gtk4"]
categories = ["gui", "command-line-utilities", "os::linux-apis"]
default-run = "noos-package-manager"

[[bin]]
name = "noos-package-manager"
path = "src/main.rs"

[[bin]]
name = "noos-up"
path = "src/bin/noos_up.rs"

[dependencies]
gtk4 = { version = "0.9.6", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.7.2", package = "libadwaita", features = ["v1_5"] }
glib = "0.20.9"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "process", "fs", "sync", "macros", "time"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
async-channel = "2.3.1"
urlencoding = "2.1.3"
tempfile = "3.19.1"
ratatui = "0.29.0"
crossterm = "0.28.1"
