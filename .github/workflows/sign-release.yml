name: Sign release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à signer (ex: v0.1.13)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Signer les artefacts avec cosign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Installer cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION="v3.1.3"
          curl -fsSL -o /tmp/cosign-linux-amd64 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL -o /tmp/cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          (cd /tmp && grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -)
          install -m 755 /tmp/cosign-linux-amd64 /usr/local/bin/cosign

      - name: Télécharger les artefacts de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - name: Signer les artefacts
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in *; do
            case "$asset" in
              *.sigstore.json|*.intoto.jsonl|*.sig|*.pem|*.pub|*.asc)
                continue
                ;;
            esac
            echo "Signature de ${asset}"
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done

      - name: Publier les signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(release-assets/*.sigstore.json)
          if (( ${#bundles[@]} == 0 )); then
            echo "Aucune signature produite." >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" \
            "${bundles[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
