name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, tests et contrôles de sécurité
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer les outils
        run: |
          pacman -Sy --noconfirm archlinux-keyring || true
          pacman -Syu --noconfirm --needed \
            base-devel git curl libarchive \
            cargo rust namcap checksec cargo-audit cargo-auditable syft \
            meson ninja vala gobject-introspection gi-docgen glib2-devel sassc \
            gettext pkgconf gtk4 appstream fribidi graphene pango

      # libadapta système : nécessaire pour `cargo test` et `cargo clippy`.
      # Le paquet construit sa propre copie embarquée dans le PKGBUILD.
      - name: Cache libAdapta
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: /var/cache/libadapta-ci
          key: libadapta-${{ runner.arch }}-3cbf69d2-a797378f0282933d85e125ceaccc150bc3a00ed0

      - name: Installer libAdapta
        run: ./.github/scripts/install-libadapta.sh

      - name: Récupérer les dépendances
        run: cargo fetch --locked

      - name: Tests Rust
        run: cargo test --frozen --all-features

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Audit des dépendances Rust
        run: cargo audit --deny warnings

      - name: Retirer libadapta système avant l'empaquetage
        run: |
          # Les tests Rust ont utilisé le paquet AUR libadapta. Le paquet
          # noos-package-manager embarque sa propre copie sous le même soname ;
          # on retire la copie système pour que namcap ne la considère pas comme
          # une dépendance externe.
          if pacman -Q libadapta >/dev/null 2>&1; then
            pacman -Rdd --noconfirm libadapta
          fi

      - name: Construire le paquet
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          rm -rf /tmp/srcbuild
          mkdir -p "/tmp/srcbuild/noos-package-manager-${VERSION}"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=target -cf - . \
            | tar -C "/tmp/srcbuild/noos-package-manager-${VERSION}" -xf -
          tar -C /tmp/srcbuild -czf "$GITHUB_WORKSPACE/noos-package-manager-${VERSION}.tar.gz" \
            "noos-package-manager-${VERSION}"
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && makepkg --nodeps --nocheck --skipchecksums --noconfirm"

      - name: Namcap
        run: |
          set -euo pipefail
          PKG="$(ls -1 noos-package-manager-*.pkg.tar.zst | grep -v debug | head -1)"
          namcap PKGBUILD | tee namcap-pkgbuild.txt
          if grep -qE ' E: ' namcap-pkgbuild.txt; then
            echo "Namcap a signalé une erreur sur le PKGBUILD." >&2
            exit 1
          fi
          namcap "$PKG" | tee namcap-package.txt
          if grep -qE ' E: ' namcap-package.txt; then
            echo "Namcap a signalé une erreur sur le paquet." >&2
            exit 1
          fi

      - name: Checksec
        run: |
          set -euo pipefail
          PKG="$(ls -1 noos-package-manager-*.pkg.tar.zst | grep -v debug | head -1)"
          mkdir -p /tmp/pkg-check
          bsdtar -xf "$PKG" -C /tmp/pkg-check
          chmod +x /tmp/pkg-check/usr/bin/noos-package-manager
          checksec file --no-banner \
            --fail-if=relro,pie,canary,nx,rpath,runpath,symbols \
            /tmp/pkg-check/usr/bin/noos-package-manager

      - name: Audit des dépendances embarquées
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          cargo audit -D warnings bin \
            "src/noos-package-manager-${VERSION}/target/release/noos-package-manager"

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            namcap-pkgbuild.txt
            namcap-package.txt
          if-no-files-found: ignore
